name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The Chinese pinyin tables and the two Kokoro vocabularies are generated
      # from `pinyin-pro` and from the measured tokenizer vocabularies, and they
      # are committed. The tests pin the *committed* data, so they cannot notice
      # that it no longer matches the dependency it came from — a `pinyin-pro`
      # bump that changes a reading would leave every test green and the data
      # stale. Both scripts have a `--check` mode for exactly that, and this is
      # the only place it runs. They need `node_modules`, hence the position.
      - run: node scripts/gen-pinyin-pro-data.mjs --check
      - run: node scripts/gen-kokoro-vocab.mjs --check
      # The phonemize wrapper imports wasm-pack's output, and `pnpm build` runs
      # the wasm build through its `prebuild` hook — so the Rust toolchain is a
      # build dependency of this repo now, not just a local convenience.
      # This has to run before `typecheck` and `test`: both read the generated
      # `.d.ts` and load the generated `.wasm`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: pnpm build:wasm
      # The Rust half of the phonemizer has its own tests — the dictionary
      # protocol, and later the pipeline's parity corpus. Nothing else runs them,
      # and the side panel smoke test rotted once already while nothing ran it.
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm check:manifest
      # Drives the production build's side panel; it rotted once while nothing ran it.
      - run: pnpm smoke:sidepanel
