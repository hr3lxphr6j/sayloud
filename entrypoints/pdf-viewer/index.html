<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SayLoud</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #f2f2f4;
        color: #1c1c1e;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Visually hidden but present in the DOM (for e2e assertions and
         screen readers). Same pattern as Bootstrap's sr-only. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ─── Design tokens ───────────────────────────────────────────────── */
      :root {
        --toolbar-bg: #1c1c1e;
        --toolbar-fg: #f5f5f7;
        --toolbar-border: rgba(255, 255, 255, 0.1);
        --ctrl-border: rgba(255, 255, 255, 0.18);
        --ctrl-hover: rgba(255, 255, 255, 0.09);
        --ctrl-active-bg: rgba(255, 255, 255, 0.16);
        --accent: #4c9aff;
        --sidebar-bg: #242426;
        --sidebar-fg: #f5f5f7;
        --sidebar-border: rgba(255, 255, 255, 0.08);
        --radius: 8px;
      }

      /* ─── Toolbar ─────────────────────────────────────────────────────── */
      .pdf-top {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        height: 44px;
        background: var(--toolbar-bg);
        color: var(--toolbar-fg);
        border-bottom: 1px solid var(--toolbar-border);
        flex-shrink: 0;
        user-select: none;
      }

      .pdf-top-left,
      .pdf-top-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .pdf-top-spacer {
        flex: 1;
      }

      /* ─── Control groups (pill containers) ───────────────────────────── */
      .pdf-ctrl-group {
        display: flex;
        align-items: center;
        border: 1px solid var(--ctrl-border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .pdf-ctrl-group > * + * {
        border-left: 1px solid var(--ctrl-border);
      }

      .pdf-ctrl-group > button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 30px;
        padding: 0 7px;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--toolbar-fg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.12s;
      }

      .pdf-ctrl-group > button:hover:not(:disabled) {
        background: var(--ctrl-hover);
      }

      .pdf-ctrl-group > button:active:not(:disabled) {
        background: var(--ctrl-active-bg);
      }

      .pdf-ctrl-group > button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      /* Standalone icon button (sidebar toggle, info) */
      .pdf-icon-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 30px;
        padding: 0;
        border: 1px solid var(--ctrl-border);
        border-radius: var(--radius);
        background: transparent;
        color: var(--toolbar-fg);
        font: inherit;
        cursor: pointer;
        transition: background 0.12s;
        flex-shrink: 0;
      }

      .pdf-icon-button:hover:not(:disabled) {
        background: var(--ctrl-hover);
      }

      .pdf-icon-button:active:not(:disabled) {
        background: var(--ctrl-active-bg);
      }

      .pdf-icon-button:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .pdf-icon-button[aria-pressed='true'] {
        background: var(--ctrl-active-bg);
        border-color: rgba(255, 255, 255, 0.3);
      }

      /* ─── Info tooltip ────────────────────────────────────────────────── */
      .pdf-info-wrap {
        position: relative;
      }

      .pdf-info-tooltip {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        min-width: 200px;
        max-width: 280px;
        padding: 9px 12px;
        border-radius: var(--radius);
        background: #3a3a3c;
        color: var(--toolbar-fg);
        font-size: 12px;
        line-height: 1.5;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        z-index: 200;
        white-space: normal;
        pointer-events: none;
      }

      .pdf-info-wrap:hover .pdf-info-tooltip,
      .pdf-info-wrap:focus-within .pdf-info-tooltip {
        display: block;
      }

      /* ─── Zoom level label ────────────────────────────────────────────── */
      .pdf-zoom-level {
        min-width: 46px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
      }

      /* ─── Page field ──────────────────────────────────────────────────── */
      .pdf-page-field {
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 0 6px;
        height: 30px;
        margin: 0;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .pdf-page-field input {
        width: 36px;
        padding: 2px 4px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--toolbar-fg);
        font: inherit;
        font-size: 12px;
        text-align: center;
      }

      .pdf-page-field input:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.1);
      }

      /* ─── Search bar ──────────────────────────────────────────────────── */
      .pdf-search {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: #2c2c2e;
        color: var(--toolbar-fg);
        border-bottom: 1px solid var(--toolbar-border);
      }

      .pdf-search-icon {
        opacity: 0.45;
        display: flex;
        align-items: center;
        flex-shrink: 0;
      }

      .pdf-search input {
        flex: 1;
        max-width: 300px;
        padding: 5px 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.07);
        color: var(--toolbar-fg);
        font: inherit;
        font-size: 13px;
      }

      .pdf-search input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .pdf-search input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .pdf-search-count {
        min-width: 56px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0.7;
        text-align: center;
      }

      .pdf-search .pdf-ctrl-group > button {
        height: 28px;
      }

      .pdf-search-close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--toolbar-fg);
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.1s, background 0.1s;
      }

      .pdf-search-close:hover {
        opacity: 1;
        background: var(--ctrl-hover);
      }

      /* ─── Notice & file picker ────────────────────────────────────────── */
      .pdf-notice {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      .pdf-notice p {
        margin: 0;
      }

      .pdf-pick {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: var(--radius);
        background: #3a3a3c;
        color: var(--toolbar-fg);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.12s;
      }

      .pdf-pick:hover {
        background: #48484a;
      }

      .pdf-pick input {
        display: none;
      }

      /* ─── Password card ───────────────────────────────────────────────── */
      .pdf-password {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: #fff;
        border-top: 1px solid #d9d9de;
        border-bottom: 1px solid #d9d9de;
      }

      .pdf-password h2 {
        margin: 0;
        font-size: 14px;
      }

      .pdf-password p {
        flex-basis: 100%;
        margin: 0;
        color: #b00020;
      }

      .pdf-password input {
        padding: 5px 10px;
        border: 1px solid #b9b9c0;
        border-radius: var(--radius);
        font: inherit;
      }

      .pdf-password button {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5px 12px;
        border: 1px solid #b9b9c0;
        border-radius: var(--radius);
        background: #fff;
        font: inherit;
        cursor: pointer;
        transition: background 0.1s;
      }

      .pdf-password button:hover {
        background: #f5f5f7;
      }

      /* ─── Viewer layout ───────────────────────────────────────────────── */
      #pdf-pages {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      .pdf-viewer-root {
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      .pdf-viewer-main {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }

      /* ─── Sidebar ─────────────────────────────────────────────────────── */
      .pdf-sidebar {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 180px;
        flex: 0 0 180px;
        min-height: 0;
        background: var(--sidebar-bg);
        color: var(--sidebar-fg);
        border-right: 1px solid var(--sidebar-border);
      }

      /* 4 px drag handle at the right edge */
      .pdf-sidebar-resizer {
        position: absolute;
        right: -2px;
        top: 0;
        bottom: 0;
        width: 4px;
        cursor: col-resize;
        z-index: 10;
        background: transparent;
        transition: background 0.15s;
      }

      .pdf-sidebar-resizer:hover {
        background: var(--accent);
      }

      /* Tabs: underline-indicator style */
      .pdf-sidebar-tabs {
        display: flex;
        border-bottom: 1px solid var(--sidebar-border);
        flex-shrink: 0;
      }

      .pdf-sidebar-tabs button {
        flex: 1;
        padding: 8px 6px;
        border: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        border-radius: 0;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: color 0.12s, border-color 0.12s;
      }

      .pdf-sidebar-tabs button:hover {
        color: var(--sidebar-fg);
      }

      .pdf-sidebar-tabs button[aria-selected='true'] {
        color: var(--sidebar-fg);
        border-bottom-color: var(--accent);
      }

      .pdf-thumbs-pane {
        flex: 1;
        min-height: 0;
      }

      .pdf-thumb {
        position: absolute;
        left: 0;
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .pdf-thumb button {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 4px;
        border: 1.5px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.5);
        font: inherit;
        font-size: 10px;
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s, color 0.12s;
      }

      .pdf-thumb button:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: var(--sidebar-fg);
      }

      .pdf-thumb button.pdf-thumb-current {
        border-color: var(--accent);
        background: rgba(76, 154, 255, 0.14);
        color: var(--sidebar-fg);
      }

      .pdf-thumb-image {
        display: block;
        background: #fff;
        border-radius: 2px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }

      .pdf-thumb-label {
        font-size: 10px;
        line-height: 14px;
      }

      .pdf-outline {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px 4px;
        font-size: 12px;
      }

      .pdf-outline ul {
        margin: 0;
        padding-left: 10px;
        list-style: none;
      }

      .pdf-outline > ul {
        padding-left: 0;
      }

      .pdf-outline button {
        width: 100%;
        padding: 4px 6px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: rgba(255, 255, 255, 0.7);
        font: inherit;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.1s, color 0.1s;
      }

      .pdf-outline button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.1);
        color: var(--sidebar-fg);
      }

      .pdf-outline button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .pdf-outline-empty {
        margin: 0;
        padding: 8px 6px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 12px;
      }
      #pdf-viewport {
        background: #525659;
      }
      .pdf-page-raster {
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      /* One page's transparent text over the raster. The element is sized to
         the *unrotated* page and rotated as a whole, so the span coordinates
         are always PDFium's own (top-left, y down). */
      .pdf-page-layer {
        position: absolute;
        inset: 0;
      }
      .pdf-text-layer {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        line-height: 1;
        z-index: 1;
      }
      .pdf-text-block {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      .pdf-text-run {
        position: absolute;
        white-space: pre;
        transform-origin: 0 0;
        color: transparent;
        cursor: text;
        overflow: visible;
      }
      .pdf-text-layer ::selection {
        background: rgba(76, 154, 255, 0.35);
      }

      /* The search plugin's rectangles, in PDFium's own page space. The wrapper
         is sized and rotated with `applyPageTransform`; the plugin only paints
         scaled divs inside it. */
      .pdf-search-layer {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
        z-index: 2;
      }

      /* The sentence is painted by `EmbedHighlightLayer`, not by
         `::highlight()`: PDFium's rectangles are the glyph boxes, while the
         invisible text layer's metrics are approximate. `CSS.highlights` still
         carries the range (the word highlight and the e2e assertions read it),
         so its own paint is switched off here. */
      ::highlight(sayloud-sentence) {
        background-color: transparent !important;
      }
      .pdf-highlight-rect {
        position: absolute;
        background: rgba(255, 214, 0, 0.34);
        border-radius: 2px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pdf-chrome"></div>
    <main id="pdf-pages"></main>
    <div id="sayloud-host"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
