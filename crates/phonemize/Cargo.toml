[package]
name = "phonemize"
version = "0.1.0"
edition = "2021"

# `cdylib` is what wasm-pack turns into `phonemize_bg.wasm`. `rlib` is what makes
# the crate usable from `tests/` — a `cdylib`-only crate cannot be linked into an
# integration test, and the pipeline's parity tests live there.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# `js_sys::Promise`, for the `ready()` handshake.
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
# The JS-facing shapes cross the boundary as plain objects, not JSON strings.
serde-wasm-bindgen = "0.6"

# Dictionary decompression: shipped compressed, unpacked inside the wasm. This is
# the pure-Rust decoder rather than the C `zstd` crate, which
# cannot link for `wasm32-unknown-unknown` on macOS: zstd-sys compiles the C
# sources to wasm objects correctly, but archives them with the host `ar`, which
# only understands Mach-O. It silently writes an archive holding just
# `__.SYMDEF SORTED` (96 bytes, no members) and the link then fails on every
# `ZSTD_*` symbol. Working around that means putting `llvm-ar` on every build
# machine and in CI.
#
# ruzstd reads the same `.zst` frames — verified byte-identical against the
# reference `zstd -19` CLI — with no C toolchain. It is decode-only, which is all
# the wasm does. Cost: ~120 ms for a 45 MB dictionary, measured in wasm.
ruzstd = "0.9"

# Japanese segmentation. `default-features = false` is required
# rather than tidy: the default feature is `mmap`, and there is nothing to memory
# map on `wasm32-unknown-unknown`. The dictionary crate is a direct dependency as
# well because `lindera::dictionary::Dictionary` is a type *alias* for
# `lindera_dictionary::dictionary::Dictionary`, and building one from bytes means
# naming its component types — `lindera` re-exports `Dictionary` and `Metadata`
# and nothing else. See `src/g2p/ja/segmenter.rs` for why that is necessary
# at all: the crate has no `load_from_bytes`.
# English G2P: CMU Dict + ARPAbet→IPA, which is what the Latin runs of a CJK
# sentence need. The data is compiled into the wasm, so this language fetches no
# dictionary.
#
# **A git dependency, and that is the point rather than a shortcut.** The
# published 0.4.0 does not ship the dictionary at all: its `EnglishPhonemizer::new()`
# looks for `cmudict_data.json` on the filesystem (`CMUDICT_PATH`, `./`,
# `/usr/share/piper/...`), and `wasm32-unknown-unknown` has no filesystem — the
# crate's own `data/` directory and the `bundled-dicts` feature that reads it
# with `include_str!` landed after 0.4.0 and are unreleased. The alternatives
# (espeak-ng-sys is not on crates.io, the C sources do not build for
# `wasm32-unknown-unknown`, and the pure-Rust port is GPL-3.0).
#
# Pinned to a revision rather than a branch: the 3.75 MB dictionary is embedded
# in the module, so an unpinned revision would make the wasm's contents a
# function of when it was built.
#
# `default-features = false` is required, not tidy: the default set is the seven
# other frontends, and `japanese` in particular would put a second Japanese
# pipeline (jpreprocess) into the module.
piper-plus-g2p = { git = "https://github.com/ayutaz/piper-plus", rev = "82ee4e7a9b7aded42e0d0d5fd8298b42bfa51a16", default-features = false, features = [
  "english",
  "bundled-dicts",
] }

lindera = { version = "6.2", default-features = false }
lindera-dictionary = { version = "6.2", default-features = false }
# The dictionary ships as one asset, so the nine files lindera wants are wrapped
# in a tar archive. A transport wrapper, not a format: the bytes inside are
# lindera's own.
tar = "0.4"

# No numeral crate. English's numeral reading used to be `num2words` here — 60 KB
# of the release wasm, measured by building the module with the dependency and
# without it (6,102,605 B → 6,041,188 B, −61,417 B) — and it was removed rather than
# kept
# beside the engine: `src/tn/engine.rs` reads numerals, money, dates and
# abbreviations with the WeText grammars, and a second reader for the same step
# was a second answer to the same question. What is left is one rule, in
# `src/tn/mod.rs`: a numeral is read by the engine or the sentence is declined,
# never read with the digits missing (`I have 3 cats` → `aɪ hæv kˈæts` was the bug
# this step closed). The CMU dictionary above is a dictionary and not a rule
# engine, so a digit still has no pronunciation of its own to find.

# Chinese word segmentation. The JavaScript side uses `jieba-wasm`,
# which is this crate compiled to wasm, so the boundaries match the training
# target rather than approximating it — see `chinese.ts`'s `jiebaBoundaries`.
# A one-off cross-check before the port was written found this crate and
# `jieba-wasm` 2.4.0 segmenting a 98-sentence corpus identically on all 98; the
# committed check is the 46-sentence pipeline corpus, where a wrong boundary shows
# up as a wrong space (`crates/phonemize/tests/zh_pipeline.rs`).
#
# **`default-features = false` is required, not tidy.** The default feature is
# `default-dict`, which embeds `src/data/dict.txt` through `include-flate` — and
# that crate decompresses with the C `zstd` crate at runtime, so `zstd-sys` ends
# up in the wasm. `zstd-sys` archives its wasm objects with the host `ar`, which
# only understands Mach-O; it writes an archive with no members and the link then
# fails on every `ZSTD_*` symbol (`undefined symbol: ZSTD_freeDCtx`, reproduced
# 2026-10-03). This is the same failure the `ruzstd` note above describes, and
# the same answer: keep the C zstd out of the build. The dictionary arrives
# through the registry instead, like IPADic — see `scripts/setup/setup-jieba-dict.sh`.
#
# The HMM model and the segmentation algorithm are not behind that feature, so
# disabling it costs nothing but the embedded dictionary.
jieba-rs = { version = "0.11", default-features = false }

# Weighted-FST text normalization, for the numeral step of the English
# pipeline. The engine is **not** a dependency: `src/tn/wetext/` is a copy
# of `wetext-rs` 0.1.2 with the five changes `NOTICE` lists, because the
# published crate can only load FSTs from a directory, has a defect that makes
# `２０２２年` normalize to nothing, and has a second one that made English TN skip
# every sentence with no digit in it. What those three have in common is that
# they are all in the published crate's shape rather than in its behaviour, and
# copying the source is what makes them fixable here.
#
# **`SerializableFst::load` takes a `&[u8]`**, which is why the copy needs no
# filesystem: the only constructor it has parses a slice the dictionary protocol
# handed it. So nothing here reads a file, and nothing here writes one — the
# half of `rustfst` that does is linked out.
#
# `rustfst` is what the +1,013,905 B is (measured before and after, release wasm,
# same profile); the copied engine is ~50 KB of source. Default features are
# **required**, unlike everywhere else in this file. The default is
# `state-label-u32`, which is what makes `rustfst::Label` a `u32` — and the copied
# engine reads the FST's labels as UTF-8 *bytes* (`label as u8`) and compares them
# against `EPS_LABEL`. Turning it off changes the label type and with it that
# cast, silently, at the first non-ASCII character.
rustfst = "1"

# `wetext`'s own error type is a `thiserror` enum, and the copy keeps it: the
# alternative is hand-writing six `Display` arms, which is how every other error
# in this crate is spelled. A proc macro with no runtime, so it costs nothing in
# the wasm.
thiserror = "2"

# English G2P's letter-to-sound rules, which are regular expressions matched over
# the text. Not the contraction tables any more — those are `aho-corasick`'s below.
regex = "1"

# English contractions (`src/tn/wetext/contractions.rs`), which English TN turns on
# (`tn::engine::english`). One automaton over the 412 keys of the three embedded
# JSON tables (`src/tn/wetext/data/`, 6.5 KB, byte-identical to the Python
# `contractions` package's own copies, which is what the tables are).
#
# **This replaced one `Regex` per key**, and the reason was the build rather than the
# scan: 412 patterns compiled on the first apostrophe-bearing sentence is 56 ms and
# 6.7 MB of heap, where the automaton this uses is 0.73 ms and 89 KB — and the first
# call is the first sentence of an article, which is not a moment anybody chose.
# `tn::engine::english` calls `contractions::warm_up`, so the build lands in
# `prepare` beside the FST parses rather than in the middle of the first sentence.
#
# The crate was already in the wasm before this — `regex` depends on it — so the
# +3.7 KB measured after the change is the automaton machinery, not the crate.
aho-corasick = "1"
once_cell = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.3 is not a dependency anything in this crate calls. It arrives
# with `rustfst` -> `rand` -> `rand_core`, and it refuses to compile for
# `wasm32-unknown-unknown` unless it is told which backend to use: the `cfg`
# lives in `.cargo/config.toml`, and the feature has to be turned on by a direct
# dependency, which is this one. This is the fourth dependency in this crate
# that cannot cross the wasm boundary as published, and the first where the fix
# is a flag rather than a decoder or a frontend swap — there is no C here, just
# a `cfg`.
#
# Bound to the wasm target rather than declared generally: on the host, nothing
# has to be said about which backend to use, and a direct dependency there would
# only pin a version this crate does not otherwise care about.
getrandom = { version = "0.3", features = ["wasm_js"] }
