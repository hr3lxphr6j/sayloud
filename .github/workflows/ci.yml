name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: macos-latest
    # Every run starts from a clean checkout, so the incremental state cargo would
    # write into `target/` is never read back within a run — it is most of that
    # directory's size, and rust-cache hashes every `CARGO_*` variable into the
    # key, which is the other reason this belongs here rather than being left out.
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # No `version` input: the action reads `packageManager` from package.json,
      # so CI, a fresh clone and the machine the lockfile was written on all
      # resolve the same pnpm. Pinning 9 here instead is what kept this workflow
      # red from its first run: `pnpm-workspace.yaml` holds settings only (no
      # `packages:`), which pnpm 9's `store path` rejects with "packages field
      # missing or empty" — a command setup-node runs for its cache, before any
      # step of ours, so nothing below had ever executed.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The Chinese pinyin tables, the two Kokoro vocabularies, and the English
      # letter-to-sound rules are generated — from `pinyin-pro`, from the measured
      # tokenizer vocabularies, and from a dump of HeadTTS's rules — and they are
      # committed. The tests pin the *committed* data, so they cannot notice that it
      # no longer matches the thing it came from: a `pinyin-pro` bump that changes a
      # reading would leave every test green and the data stale, and the same is
      # true of a hand edit to `rules.rs`. All three scripts have a `--check` mode
      # for exactly that, and this is the only place it runs. They need
      # `node_modules`, hence the position.
      - run: node scripts/generate/gen-pinyin-pro-data.mjs --check
      - run: node scripts/generate/gen-kokoro-vocab.mjs --check
      - run: pnpm check:headtts
      # The phonemize wrapper imports wasm-pack's output, and `pnpm build` runs
      # the wasm build through its `prebuild` hook — so the Rust toolchain is a
      # build dependency of this repo now, not just a local convenience.
      # This has to run before `typecheck` and `test`: both read the generated
      # `.d.ts` and load the generated `.wasm`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # The two cargo steps below compile the same 149 crates twice, once for the
      # wasm target and once for the host: 224s and 110s, half this job's wall
      # clock between them. Both write into the repository's one `target/` — the
      # crate is the only member of a workspace rooted here, and wasm-pack builds
      # into it too (`target/wasm32-unknown-unknown/`) — so one cache covers both.
      #
      # This has to run after `rustc` and `cargo` are on PATH, because the key
      # starts from their versions, and before the first cargo invocation, because
      # a cache restored after a build has nothing left to save.
      #
      # `save-if` keeps writes to pushes on `main`: a pull request restores the
      # entry its lockfile descends from and rebuilds the difference, whereas
      # saving would add an entry per branch, for a lockfile that never lands.
      # `cache-bin` is off because both tools above are installed by their own
      # actions.
      #
      # No `key` rotating on this file's contents, which is what the reference
      # setup does: it exists there so a separate warm-cache job can save a fresh
      # entry after the build changes. Here the job that builds is the one that
      # saves, and the action stores only dependency artifacts — never the
      # workspace crate's own — so editing this file costs nothing but the restore.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v1-sayloud
          shared-key: cargo
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm build:wasm
      # The Rust half of the phonemizer has its own tests — the dictionary
      # protocol, and later the pipeline's parity corpus. Nothing else runs them,
      # and the side panel smoke test rotted once already while nothing ran it.
      - run: cargo test --workspace
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm check:manifest
      # Drives the production build's side panel; it rotted once while nothing ran it.
      - run: pnpm smoke:sidepanel
