<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SayLoud BR-only page</title>
  </head>
  <body>
    <!--
      Mirrors the HTML 4.01-era archives (marxists.org and friends): a title and
      a date in <p> tags, then the whole document as <br>-separated text nodes
      that no block selector will find.
    -->
    <p class="title">Short title.</p>
    <p class="date">A date.</p>
    <br />
    First body sentence here.<br />
    Second body sentence here.<br />
    Third body sentence here.<br />
  </body>
</html>
