<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SayLoud</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #f2f2f4;
        color: #1c1c1e;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* The one line that is always visible: reading order is a known limit,
         and saying so is what keeps it from looking like a bug. */
      .pdf-top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #1c1c1e;
        color: #fff;
      }
      .pdf-order-hint {
        flex: 1;
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
      }
      .pdf-zoom {
        display: flex;
        gap: 4px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .pdf-zoom button {
        min-width: 36px;
        padding: 3px 8px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .pdf-zoom button[aria-pressed='true'] {
        background: #fff;
        color: #1c1c1e;
      }

      .pdf-notice {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }
      .pdf-notice p {
        margin: 0;
      }
      .pdf-pick {
        padding: 6px 12px;
        border-radius: 6px;
        background: #1c1c1e;
        color: #fff;
        cursor: pointer;
      }
      .pdf-pick input {
        display: none;
      }

      .pdf-password {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: #fff;
        border-top: 1px solid #d9d9de;
        border-bottom: 1px solid #d9d9de;
      }
      .pdf-password h2 {
        margin: 0;
        font-size: 14px;
      }
      .pdf-password p {
        flex-basis: 100%;
        margin: 0;
        color: #b00020;
      }
      .pdf-password input {
        padding: 4px 8px;
        border: 1px solid #b9b9c0;
        border-radius: 6px;
        font: inherit;
      }
      .pdf-password button {
        padding: 4px 10px;
        border: 1px solid #b9b9c0;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      #pdf-pages {
        position: relative;
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 16px;
      }
      .pdf-page {
        position: relative;
        flex: none;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }
      .pdf-page-canvas {
        display: block;
      }

      /* The text layer sits exactly over the canvas. Its glyphs are invisible
         because the canvas already drew them; the nodes are there for selection,
         highlighting and click-to-seek. */
      .pdf-text-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        line-height: 1;
      }
      .pdf-text-item {
        position: absolute;
        white-space: pre;
        transform-origin: 0 0;
        color: transparent;
        cursor: text;
      }
      .pdf-text-layer ::selection {
        background: rgba(76, 154, 255, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="pdf-chrome"></div>
    <main id="pdf-pages"></main>
    <div id="sayloud-host"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
