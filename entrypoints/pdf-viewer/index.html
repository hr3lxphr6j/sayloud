<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SayLoud</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: #f2f2f4;
        color: #1c1c1e;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* The one line that is always visible: reading order is a known limit,
         and saying so is what keeps it from looking like a bug. */
      .pdf-top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #1c1c1e;
        color: #fff;
      }
      .pdf-order-hint {
        flex: 1;
        margin: 0;
        font-size: 12px;
        opacity: 0.85;
      }
      .pdf-zoom {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .pdf-zoom button {
        min-width: 36px;
        padding: 3px 8px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      .pdf-zoom button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pdf-zoom-level {
        min-width: 44px;
        text-align: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        opacity: 0.9;
      }

      .pdf-notice {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }
      .pdf-notice p {
        margin: 0;
      }
      .pdf-pick {
        padding: 6px 12px;
        border-radius: 6px;
        background: #1c1c1e;
        color: #fff;
        cursor: pointer;
      }
      .pdf-pick input {
        display: none;
      }

      .pdf-password {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: #fff;
        border-top: 1px solid #d9d9de;
        border-bottom: 1px solid #d9d9de;
      }
      .pdf-password h2 {
        margin: 0;
        font-size: 14px;
      }
      .pdf-password p {
        flex-basis: 100%;
        margin: 0;
        color: #b00020;
      }
      .pdf-password input {
        padding: 4px 8px;
        border: 1px solid #b9b9c0;
        border-radius: 6px;
        font: inherit;
      }
      .pdf-password button {
        padding: 4px 10px;
        border: 1px solid #b9b9c0;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      /* The EmbedPDF tree fills this box; the viewport inside it scrolls. */
      #pdf-pages {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #pdf-viewport {
        background: #525659;
      }
      .pdf-page-raster {
        display: block;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      /* One page's transparent text over the raster. The element is sized to
         the *unrotated* page and rotated as a whole, so the span coordinates
         are always PDFium's own (top-left, y down). */
      .pdf-page-layer {
        position: absolute;
        inset: 0;
      }
      .pdf-text-layer {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        line-height: 1;
        z-index: 1;
      }
      .pdf-text-block {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
      }
      .pdf-text-run {
        position: absolute;
        white-space: pre;
        transform-origin: 0 0;
        color: transparent;
        cursor: text;
        overflow: visible;
      }
      .pdf-text-layer ::selection {
        background: rgba(76, 154, 255, 0.35);
      }

      /* The sentence is painted by `EmbedHighlightLayer`, not by
         `::highlight()`: PDFium's rectangles are the glyph boxes, while the
         invisible text layer's metrics are approximate. `CSS.highlights` still
         carries the range (the word highlight and the e2e assertions read it),
         so its own paint is switched off here. */
      ::highlight(sayloud-sentence) {
        background-color: transparent !important;
      }
      .pdf-highlight-rect {
        position: absolute;
        background: rgba(255, 214, 0, 0.34);
        border-radius: 2px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="pdf-chrome"></div>
    <main id="pdf-pages"></main>
    <div id="sayloud-host"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
