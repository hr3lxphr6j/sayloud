<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>查看 Kokoro 可用音色</title>
  <style>
    body { font-family: monospace; padding: 2rem; background: #0B0E14; color: #F8FAFC; }
    button { background: #38BDF8; color: #0F172A; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; margin: 0.5rem; }
    pre { background: #1E293B; padding: 1rem; border-radius: 6px; overflow: auto; }
  </style>
</head>
<body>
  <h1>查看 Kokoro 可用音色</h1>
  <button onclick="listVoices()">列出所有音色</button>
  <button onclick="testJapaneseWithEnglishVoice()">用英文音色测试日语</button>
  <pre id="output">等待...</pre>
  
  <script type="module">
    import { KokoroTTS } from 'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm';
    
    let tts = null;
    
    async function initTTS() {
      if (!tts) {
        document.getElementById('output').textContent = '加载模型...';
        tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
          dtype: 'q8',
          device: 'wasm',
        });
      }
      return tts;
    }
    
    window.listVoices = async function() {
      try {
        const tts = await initTTS();
        const voices = tts.list_voices();
        document.getElementById('output').textContent = '可用音色：\n\n' + JSON.stringify(voices, null, 2);
      } catch (error) {
        document.getElementById('output').textContent = '错误：' + error.message;
        console.error(error);
      }
    };
    
    window.testJapaneseWithEnglishVoice = async function() {
      try {
        const tts = await initTTS();
        document.getElementById('output').textContent = '测试：用英文音色读日语...';
        
        // 用英文音色测试日语文本
        const audio = await tts.generate('こんにちは', { voice: 'af_sky' });
        
        const wavData = createWav(audio.audio, 24000);
        const audioBlob = new Blob([wavData], { type: 'audio/wav' });
        const audioUrl = URL.createObjectURL(audioBlob);
        
        document.getElementById('output').innerHTML = `
✅ 成功！
输入：こんにちは
音色：af_sky (英文)
<audio controls src="${audioUrl}"></audio>
        `;
      } catch (error) {
        document.getElementById('output').textContent = '错误：' + error.message;
        console.error(error);
      }
    };
    
    function createWav(audioData, sampleRate) {
      const numChannels = 1, bitsPerSample = 32, bytesPerSample = 4;
      const blockAlign = numChannels * bytesPerSample, byteRate = sampleRate * blockAlign;
      const dataSize = audioData.length * bytesPerSample, buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
      };
      writeString(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeString(8, 'WAVE');
      writeString(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 3, true);
      view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true); view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true); writeString(36, 'data'); view.setUint32(40, dataSize, true);
      for (let i = 0; i < audioData.length; i++) view.setFloat32(44 + i * 4, audioData[i], true);
      return buffer;
    }
  </script>
</body>
</html>
